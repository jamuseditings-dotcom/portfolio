<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAMU · Anime opening test</title><style>body{margin:0;background:#080706;color:#fff0be;font:12px monospace}canvas{position:fixed;inset:0;width:100%;height:100%}.track{height:500vh}.controls{position:fixed;bottom:20px;left:20px;right:20px;display:flex;gap:12px;align-items:center}button,a{background:#15120b;border:1px solid #ffc00a;color:#fff0be;padding:10px}#status{margin-left:auto}</style></head><body><canvas id="opening"></canvas><div class="track"></div><div class="controls"><button id="replay">Replay</button><button id="fast">Fast-scroll test</button><a href="/">Main portfolio</a><span id="status" role="status">intro</span></div><script type="module">
import {createOpeningDriver} from './anime-opening-driver.js?v=anime-4';
const driver=createOpeningDriver(document.querySelector('canvas'));let start=performance.now();function resize(){driver.resize(innerWidth,innerHeight,innerWidth/innerHeight);}resize();addEventListener('resize',resize);document.querySelector('#replay').onclick=()=>{scrollTo(0,0);driver.reset();start=performance.now();};document.querySelector('#fast').onclick=()=>scrollTo(0,document.documentElement.scrollHeight-innerHeight);function tick(now){const p=scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight);driver.render((now-start)/1000,p*.16);const state=driver.getState();document.querySelector('#status').textContent=state.state+(state.revealReady?' · reveal ready':'');requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></body></html>
